<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent Receipt</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            height: 100vh;
            margin: 0;
            gap: 20px;
            padding: 20px;
        }

        .receipt-container {
            background-color: #fff;
            width: 700px;
            padding: 20px;
            border: 1px solid #000;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            font-size: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
        }

        .header h1 {
            margin: 0;
        }

        .content-container {
            font-size: larger;
        }

        .content-part {
            margin: 0;
            padding-left: 10px;
            padding-right: 10px;
        }

        .sign-container {
            display: flex;
            justify-content: flex-start;
            margin-top: 20px;
        }

        .sign-part {
            margin-left: 30px;
            position: relative;
        }

        .sign {
            width: 400px;
            position: absolute;
        }

        img {
            display: block;
        }

        .stamp-1 {
            margin-left: 80px;
            margin-top: 15px;
        }

        .stamp-2 {
            margin-left: 90px;
            margin-top: 15px;
        }

        .stamp-3 {
            margin-left: 100px;
            margin-top: 25px;
        }

        .stamp-4 {
            margin-left: 110px;
            margin-top: 25px;
        }

        .stamp-5 {
            margin-left: 90px;
            margin-top: 35px;
        }

        .stamp-6 {
            margin-left: 120px;
            margin-top: 35px;
        }

        .stamp-7 {
            margin-left: 140px;
            margin-top: 10px;
        }

        .stamp-8 {
            margin-left: 100px;
            margin-top: 20px;
        }

        .stamp-9 {
            margin-left: 120px;
            margin-top: 25px;
        }

        .stamp-10 {
            margin-left: 100px;
            margin-top: 25px;
        }

        .stamp-11 {
            margin-left: 150px;
            margin-top: 15px;
        }

        .stamp-12 {
            margin-left: 100px;
            margin-top: 25px;
        }


        .sign-style-1 {
            top: 45px;
            /* From pair (45, 40) */
            left: 40px;
        }

        .sign-style-2 {
            top: 23px;
            /* From pair (23, 24) */
            left: 24px;
        }

        .sign-style-3 {
            top: 43px;
            /* From pair (43, 16) */
            left: 16px;
        }

        .sign-style-4 {
            top: 15px;
            /* From pair (15, 28) */
            left: 28px;
        }

        .sign-style-5 {
            top: 41px;
            /* From pair (41, 21) */
            left: 21px;
        }

        .sign-style-6 {
            top: 14px;
            /* From pair (14, 26) */
            left: 26px;
        }

        .sign-style-7 {
            top: 17px;
            /* From pair (17, 15) */
            left: 15px;
        }

        .sign-style-8 {
            top: 42px;
            /* From pair (42, 49) */
            left: 49px;
        }

        .sign-style-9 {
            top: 11px;
            /* From pair (11, 28) */
            left: 28px;
        }

        .sign-style-10 {
            top: 23px;
            /* From pair (23, 40) */
            left: 40px;
        }

        .sign-style-11 {
            top: 22px;
            /* From pair (22, 35) */
            left: 35px;
        }

        .sign-style-12 {
            top: 22px;
            /* From pair (22, 40) */
            left: 40px;
        }

        .receipt-space {
            margin-bottom: 130px;
            /* margin-top: 180px; */
            /* Add space below every second receipt */
        }
    </style>
</head>

<body>
    <% receiptData.forEach(function(receipt, index) { %>
        <div class="receipt-container <%= ((index + 1) % 3 === 0) ? 'receipt-space' : '' %>">
            <div class="header">
                <h1>RENT RECEIPT</h1>
                <h1>
                    <%= receipt.date %>
                </h1>
            </div>
            <div class="content-part">
                <p>Generated on ClearTax</p>
                <div class="content-container">
                    <p>Received sum of INR <strong>Rs.37000</strong> from <strong>Name</strong>
                        towards the rent of property located at
                        <strong>address <strong>
                            <%= receipt.period_of_rent %>
                        </strong>
                    </p>
                </div>

                <div class="sign-container">
                    <p><strong>name</strong> (Landlord) Pan: <strong>pan</strong></p>
                    <div class="sign-part">
                        <div class="stamp-<%=index + 1 %>">
                            <img src=<%=stamp %> width="80" />
                        </div>
                        <div class="sign sign-style-<%=index + 1 %>">
                            <img src=<%=sign %> width=" 200" />
                        </div>
                    </div>
                </div>

            </div>
        </div>
        <% }); %>
</body>

</html>
